name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Environment self-check
        run: python environment_check.py
      - name: Import and CLI smoke test
        run: |
          python -c "import app, mosaic_core, video_links; print('modules ok')"
          python -m py_compile app.py mosaic_core.py video_links.py environment_check.py

  package:
    needs: check
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Prepare build assets
        run: python prepare_build.py
      - name: Build portable bundle
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1 -PythonExe (Get-Command python).Source
      - name: Archive artifact
        run: Compress-Archive -Path dist\IconMosaic\* -DestinationPath IconMosaic-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IconMosaic-windows-x64
          path: IconMosaic-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IconMosaic-windows-x64.zip
